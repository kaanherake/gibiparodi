<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101012">
  <meta name="color-scheme" content="dark">
  <title>GibiParodi | Tüm hesaplarımız 🎬</title>
  <meta name="description" content="Küp kafalar. GibiParodi’nin YouTube, TikTok ve Instagram hesapları tek bir yerde.">
  <link rel="canonical" href="https://kaanherake.github.io/gibiparodi/">
  <link rel="icon" href="avatar.jpg" type="image/jpeg">
  <link rel="apple-touch-icon" href="avatar.jpg">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="tr_TR">
  <meta property="og:title" content="GibiParodi | Tüm hesaplarımız 🎬">
  <meta property="og:description" content="Küp kafalar. YouTube, TikTok ve Instagram’da buluşalım.">
  <meta property="og:url" content="https://kaanherake.github.io/gibiparodi/">
  <meta property="og:image" content="https://kaanherake.github.io/gibiparodi/avatar.jpg">
  <meta property="og:image:alt" content="GibiParodi’nin iki Minecraft tarzı karakterli logosu">
  <meta name="twitter:card" content="summary">
  <style>
    :root{--bg:#101012;--card:#1c1c20;--gold:#ffd83d;--text:#fbfaf5;--muted:#b7b6ae;--line:#343437}
    *{box-sizing:border-box}
    html{min-height:100%;background:var(--bg)}
    body{margin:0;min-height:100vh;min-height:100svh;color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);-webkit-font-smoothing:antialiased}
    [hidden]{display:none!important}
    .world{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;background:radial-gradient(ellipse at 14% 29%,#c7881b29,transparent 41%),radial-gradient(ellipse at 90% 67%,#8054c920,transparent 37%),linear-gradient(130deg,#18140e,#101012 40%,#141019)}
    .world:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#eedc9c05 1px,transparent 1px),linear-gradient(90deg,#eedc9c05 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse at center,transparent 15%,#000 85%)}
    .world:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(16,16,18,.54) 35%,rgba(16,16,18,.54) 65%,transparent);z-index:2}
    .voxel{position:absolute;width:var(--size,110px);height:var(--size,110px);background:linear-gradient(135deg,#8b6b2638,#28221b);border:1px solid #c0a0542b;transform:rotate(-15deg) skew(5deg,5deg);box-shadow:20px 20px 0 #09090b99,0 0 55px #d39d1e0c;opacity:var(--alpha,.75)}
    .voxel:before{content:"";position:absolute;top:calc(var(--size,110px) * -.2);left:calc(var(--size,110px) * .1);width:100%;height:20%;background:#9d79302b;transform:skewX(-45deg);border-top:1px solid #d5b45c44}
    .voxel:after{content:"";position:absolute;right:calc(var(--size,110px) * -.2);top:calc(var(--size,110px) * -.1);height:100%;width:20%;background:#3b30452e;transform:skewY(-45deg);border-right:1px solid #bb973524}
    .v1{left:calc(50% - 480px);top:15%;--size:142px}.v2{left:calc(50% - 350px);top:51%;--size:73px;--alpha:.6}.v3{left:calc(50% - 555px);top:76%;--size:104px}.v4{right:calc(50% - 467px);top:14%;--size:83px}.v5{right:calc(50% - 533px);top:58%;--size:145px}.v6{right:calc(50% - 323px);top:82%;--size:52px;--alpha:.6}
    .portal{position:absolute;right:calc(50% - 470px);top:35%;width:152px;height:227px;border:14px solid #211b2c;border-radius:3px;transform:rotate(12deg);box-shadow:inset 0 0 25px #ad73ff3b,0 0 65px #8251b820,3px 3px 0 #b283da2e;background:repeating-linear-gradient(0deg,transparent 0 22px,#b971ff09 22px 24px),linear-gradient(135deg,#51335b17,#a37bc32a,#291f4622);opacity:.85}
    .spark{position:absolute;width:5px;height:5px;background:#ffdc50;box-shadow:0 0 18px #ffc93388;opacity:.65}.s1{left:12%;top:12%}.s2{left:23%;top:42%;width:3px;height:3px}.s3{right:16%;top:27%}.s4{right:9%;top:81%;width:4px;height:4px}.s5{left:17%;bottom:13%;opacity:.3}
    main{position:relative;z-index:1;max-width:480px;margin:auto;padding:38px 22px 30px;padding-top:max(38px,env(safe-area-inset-top));padding-bottom:max(30px,env(safe-area-inset-bottom))}
    header{text-align:center}
    .portrait{position:relative;width:144px;height:144px;margin:0 auto 20px;padding:5px;border:1px solid #ffd83d80;border-radius:50%;background:#242015;box-shadow:0 0 52px #ffc52b18}
    .portrait:before,.portrait:after{content:"";position:absolute;width:11px;height:11px;background:var(--gold);box-shadow:0 0 14px #ffd83d50}
    .portrait:before{top:12px;left:-20px;transform:rotate(-12deg)}
    .portrait:after{right:-16px;bottom:18px;width:7px;height:7px;transform:rotate(15deg)}
    .portrait img{display:block;width:100%;height:100%;object-fit:cover;border-radius:50%}
    h1{margin:0;font-size:40px;font-weight:850;letter-spacing:-1.8px;line-height:1.12}
    h1 span{color:var(--gold)}
    .tagline{margin:12px 0 7px;font-size:18px;line-height:1.5;font-weight:650;letter-spacing:-.2px}
    .description{margin:0 auto;max-width:310px;color:var(--muted);font-size:14px;line-height:1.65}
    .section-label{display:flex;align-items:center;gap:13px;margin:27px 0 14px;color:#aaa89e;font-size:10px;letter-spacing:2px;font-weight:750;white-space:nowrap}
    .section-label:before,.section-label:after{content:"";height:1px;background:var(--line);flex:1}
    nav{display:grid;gap:12px}
    .link{display:flex;align-items:center;gap:15px;min-height:86px;padding:16px 18px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(115deg,#222226,var(--card));color:var(--text);text-decoration:none;box-shadow:0 4px 0 #060607;transition:transform .16s ease,border-color .16s ease,background .16s ease;-webkit-tap-highlight-color:transparent}
    .link:hover{border-color:var(--gold);transform:translateY(-2px)}
    .link:active{transform:translateY(1px)}
    .link:focus-visible{outline:3px solid var(--gold);outline-offset:5px}
    .primary{background:linear-gradient(115deg,#ffe677,#ffd238);color:#19170d;border-color:#ffe16a;box-shadow:0 4px 0 #755912}
    .icon{flex-shrink:0;display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:#ffffff08;color:var(--gold)}
    .primary .icon{background:#17120a0c;color:#17170d}
    .icon svg{display:block;width:28px;height:28px}
    .words{flex:1;min-width:0}
    .words strong{display:block;font-size:17px;letter-spacing:-.25px;font-weight:750;line-height:1.25}
    .words small{display:block;font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.4}
    .primary .words small{color:#4c4019}
    .arrow{width:18px;height:18px;flex-shrink:0;opacity:.85}
    footer{text-align:center;margin:28px 0 0;color:#b7b3a8;font-size:12px;line-height:1.7;letter-spacing:.4px}
    footer sup{font-size:8px;color:#d2b85b;margin-left:2px}
    .pixels{display:flex;gap:4px;justify-content:center;margin-bottom:10px}
    .pixels i{display:block;width:5px;height:5px;background:var(--gold);opacity:.75}
    .pixels i:nth-child(2){opacity:.45}.pixels i:nth-child(3){opacity:.2}
    @media(max-width:700px){.v1{left:-46px;top:8%;--size:96px;--alpha:.6}.v2{left:-29px;top:57%;--size:65px;--alpha:.42}.v3{left:18px;top:88%;--size:54px;--alpha:.35}.v4{right:-19px;top:18%;--size:66px;--alpha:.45}.v5{right:-59px;top:74%;--size:115px;--alpha:.6}.v6{display:none}.portal{right:-51px;top:40%;width:123px;height:187px;opacity:.45}.world:after{background:linear-gradient(90deg,transparent,rgba(16,16,18,.58) 24%,rgba(16,16,18,.58) 76%,transparent)}.spark{opacity:.4}}
    @media(max-width:360px){main{padding-inline:16px}.link{gap:11px;padding-inline:14px}.words strong{font-size:16px}.words small{font-size:10.5px}h1{font-size:37px}}
    @media(prefers-reduced-motion:reduce){.link{transition:none}.link:hover,.link:active{transform:none}}
  </style>
</head>
<body>
  <div class="world" aria-hidden="true"><div class="voxel v1"></div><div class="voxel v2"></div><div class="voxel v3"></div><div class="voxel v4"></div><div class="voxel v5"></div><div class="voxel v6"></div><div class="portal"></div><i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i><i class="spark s4"></i><i class="spark s5"></i></div>
  <main>
    <header>
      <div class="portrait"><img src="avatar.jpg" width="800" height="800" alt="GibiParodi logosu" fetchpriority="high"></div>
      <h1>Gibi<span>Parodi</span></h1>
      <p class="tagline">Küp kafalar</p>
      <p class="description">Sevdiğin Türk dizi ve filmleri,<br>Minecraft evreninde.</p>
    </header>
    <div class="section-label">TÜM HESAPLARIMIZ</div>
    <nav aria-label="GibiParodi sosyal medya hesapları">
      <a class="link primary" href="https://www.youtube.com/@GibiParodi" aria-label="GibiParodi YouTube kanalında izle">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2a31 31 0 0 0-.5 4.8 31 31 0 0 0 .5 4.8 3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1 31 31 0 0 0 .5-4.8 31 31 0 0 0-.5-4.8ZM9.6 15.4V8.6l6 3.4-6 3.4Z"/></svg></span>
        <span class="words"><strong>YouTube’da izle</strong><small>Yeni sahneler ve Minecraft parodileri</small></span>
        <svg class="arrow" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M7 7h10v10"/></svg>
      </a>
      <a class="link" href="https://www.tiktok.com/@kafpuffpass" aria-label="GibiParodi TikTok hesabını takip et">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 1h-3.9v14.6a3.2 3.2 0 1 1-2.9-3.2V8.5a7.1 7.1 0 1 0 6.8 7.1V8.1a10 10 0 0 0 5.9 1.9V6.1A6 6 0 0 1 16.6 1Z"/></svg></span>
        <span class="words"><strong>TikTok’ta takip et</strong><small>Kısa videolar, tanıdık kahkahalar</small></span>
        <svg class="arrow" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M7 7h10v10"/></svg>
      </a>
      <a class="link" href="https://www.instagram.com/gibiparodi/" aria-label="GibiParodi Instagram hesabında buluşalım">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.25"/><circle cx="17.4" cy="6.6" r="1" fill="currentColor" stroke="none"/></svg></span>
        <span class="words"><strong>Instagram’da buluşalım</strong><small>Reels, hikâyeler ve sıradaki sahne</small></span>
        <svg class="arrow" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M7 7h10v10"/></svg>
      </a>
    </nav>
    <footer><div class="pixels" aria-hidden="true"><i></i><i></i><i></i></div>GibiParodi<sup>™</sup></footer>
  </main>
</body>
</html>
